name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-site.py"
      - "scripts/build-topics.py"
      - "SOURCES.md"
      - "descriptions.tsv"
      - "sources.tsv"
      - "source-topics.tsv"
      - "topic-taxonomy.tsv"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The source table and mathematical topic metadata are generated from
      # the canonical source inventory plus the human annotation tables.
      - run: pip install --quiet markdown
      - run: python3 scripts/build-site.py
      - run: python3 scripts/build-topics.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
