name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-site.py"
      - "repos.tsv"
      - "reservoir.tsv"
      - "port-sources.tsv"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The repository table is derived from the manifests, so a repository
      # added to a manifest reaches the site without a second edit.
      - run: python3 scripts/build-site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
