<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every repository — Lean Reference Corpus</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6/dist/css/tabulator_simple.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6/dist/css/tabulator_midnight.min.css" media="(prefers-color-scheme: dark)">
<style>
	html { font-size: 87.5%; }
	header.container > hgroup > h1 { font-size: 1.4rem; margin-bottom: 0.2rem; }
	header.container { padding-block: 1.2rem 0; }
	header.container nav { margin-bottom: 0; }
	main { padding-block: 1rem; }
	.tabulator { font-size: 0.82rem; }
	.tabulator-row .tabulator-cell a { font-family: var(--pico-font-family-monospace); }
	.tabulator-header-filter input { margin: 0; font-size: 0.8rem; }
</style>
</head>
<body>
<header class="container">
	<hgroup>
		<h1><a href="./">Lean Reference Corpus</a></h1>
		<p id="totals">Loading…</p>
	</hgroup>
	<nav>
		<ul>
			<li><a href="./">Search</a></li>
			<li><a href="./corpus.html" aria-current="page">Every repository</a></li>
			<li><a href="./subjects.html">By subject</a></li>
			<li><a href="./api.html">API</a></li>
		</ul>
	</nav>
</header>

<main class="container">
	<div id="table"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6/dist/js/tabulator.min.js"></script>
<script>
const KINDS = {
	lean: "Lean 4 formalizations — Mathlib and the projects built on it",
	port: "Rocq and Agda — formalized, but not in Lean",
	reservoir: "Lean package registry",
};

fetch("./corpus.json").then(r => r.json()).then(data => {
	const rows = Object.entries(data.repos).map(([name, r]) => ({name, ...r}));
	const c = data.counts;
	document.getElementById("totals").textContent =
		`${c.lean} Lean 4 formalizations including Mathlib, ${c.reservoir} packages `
		+ `from the Lean registry, and ${c.port} libraries in Rocq and Agda. Filter `
		+ `by subject to find the ones working on a given piece of mathematics.`;

	new Tabulator("#table", {
		data: rows,
		layout: "fitColumns",
		height: "70vh",
		groupBy: "kind",
		// Groups otherwise appear in the order their first row happens to fall.
		groupValues: [["lean", "port", "reservoir"]],
		groupHeader: (kind, count) => `${KINDS[kind] || kind} <span>(${count})</span>`,
		groupStartOpen: kind => kind !== "reservoir",
		initialSort: [{column: "name", dir: "asc"}],
		columns: [
			{title: "Repository", field: "name", widthGrow: 2, headerFilter: "input",
			 headerFilterPlaceholder: "filter by name",
			 variableHeight: true,
			 formatter: cell => {
				 const a = document.createElement("a");
				 a.href = cell.getRow().getData().url;
				 a.textContent = cell.getValue();
				 a.style.whiteSpace = "normal";
				 a.style.wordBreak = "break-word";
				 return a;
			 }},
			{title: "What it holds", field: "what", widthGrow: 3, headerFilter: "input",
			 headerFilterPlaceholder: "filter by subject — sphere packing, Hasse, category",
			 formatter: "textarea"},
		],
	});
});
</script>
</body>
</html>
