<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sources — Formalization Corpus</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6/dist/css/tabulator.min.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="site-header">
	<div class="shell masthead">
			<a class="brand" href="./">
				<span class="brand-mark" aria-hidden="true">FC</span>
				<span class="brand-name">Formalization Corpus</span>
		</a>
			<nav class="site-nav" aria-label="Primary">
				<a href="./">Search</a>
				<a href="./corpus.html" aria-current="page">Sources</a>
				<a href="./topics.html">Topics</a>
				<a href="./agents.html">Agents</a>
				<a href="./api.html">API</a>
			</nav>
	</div>
</header>

<main class="shell page-main">
	<header class="page-heading">
		<h1>Sources</h1>
	</header>

	<section aria-labelledby="ecosystem-title">
		<h2 id="ecosystem-title">By proof assistant</h2>
		<div class="table-wrap"><table id="ecosystems" class="metrics-table"></table></div>
	</section>

	<section aria-labelledby="source-browser-title">
		<h2 id="source-browser-title">All sources</h2>
		<p class="muted">Filter by name or description.</p>
		<div class="source-browser" id="table"></div>
	</section>
</main>

<footer class="site-footer">
	<div class="shell footer-inner">
		<div></div>
		<div class="footer-links"><a href="https://github.com/dzackgarza/formalization-corpus">GitHub</a><a href="./api.html">API</a></div>
	</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6/dist/js/tabulator.min.js"></script>
<script>
const fmt = n => Number(n || 0).toLocaleString("en-US");

Promise.all([
	fetch("./metrics.json").then(r => r.json()),
	fetch("./corpus.json").then(r => r.json()),
]).then(([metrics, corpus]) => {
	const assistants = corpus.proof_assistants || {};
	const assistantLink = id => {
		const meta = assistants[id] || {label: id, url: null};
		return meta.url ? `<a href="${meta.url}">${meta.label}</a>` : meta.label;
	};
	const rows = metrics.ecosystems.map(r => `
		<tr><td>${assistantLink(r.kind)}</td><td>${fmt(r.sources)}</td></tr>`).join("");
	const total = metrics.summary;
	document.getElementById("ecosystems").innerHTML = `
		<thead><tr><th>Proof assistant</th><th>Sources</th></tr></thead>
		<tbody>${rows}
		<tr><th>Total</th><th>${fmt(total.sources)}</th></tr></tbody>`;

	const rowsForTable = corpus.sources;

		new Tabulator("#table", {
				data: rowsForTable,
			layout: "fitColumns",
			height: "70vh",
			initialSort: [{column: "name", dir: "asc"}],
			columns: [
		{title: "Source", field: "name", widthGrow: 2, headerFilter: "input",
				 headerFilterPlaceholder: "filter by name",
				 variableHeight: true,
				 formatter: cell => {
				 const a = document.createElement("a");
				 a.href = cell.getRow().getData().url;
				 a.textContent = cell.getValue();
				 a.style.whiteSpace = "normal";
				 a.style.wordBreak = "break-word";
				 return a;
			 }},
				{title: "Proof assistant", field: "proof_assistant", widthGrow: 1,
				 formatter: cell => {
					 const meta = assistants[cell.getValue()] || {label: cell.getValue(), url: null};
					 if (!meta.url) return meta.label;
					 const a = document.createElement("a");
					 a.href = meta.url;
					 a.textContent = meta.label;
					 return a;
				 }},
		{title: "Description", field: "what", widthGrow: 3, headerFilter: "input",
		 headerFilterPlaceholder: "filter by description — sphere packing, Hasse, category",
			 formatter: "textarea"},
			],
		});
});
</script>
</body>
</html>
