<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formalization Corpus</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<style>
	/* Pico's default scale suits an article; this is a search tool. */
	html { font-size: 87.5%; }
	header.container > hgroup > h1 { font-size: 1.4rem; margin-bottom: 0.2rem; }
	header.container { padding-block: 1.2rem 0; }
	header.container nav { margin-bottom: 0; }

	/* Only what Pico has no opinion about: the shape of a search result. */
	main { padding-block: 1rem; }
	#status { margin-bottom: 0.8rem; }
	form { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
	form input { margin: 0; font-family: var(--pico-font-family-monospace); }
	form button { width: auto; margin: 0; }
	.hint, #status { font-size: 0.8rem; color: var(--pico-muted-color); }
	#status.broken { color: var(--pico-del-color); font-family: var(--pico-font-family-monospace); }
	article { padding: 0; margin-bottom: 1rem; }
	article > header {
		padding: 0.4rem 0.8rem;
		font-size: 0.8rem;
		font-weight: 600;
		display: flex;
		justify-content: space-between;
		gap: 0.6rem;
		align-items: baseline;
	}
	article > header a { text-decoration: none; font-family: var(--pico-font-family-monospace); }
	.tag { font-weight: 400; font-size: 0.7rem; color: var(--pico-muted-color); }
	.file { border-top: 1px solid var(--pico-muted-border-color); }
	.path {
		font-family: var(--pico-font-family-monospace);
		font-size: 0.72rem;
		padding: 0.35rem 0.8rem 0.1rem;
		color: var(--pico-muted-color);
	}
	.path a { color: inherit; }
	pre {
		margin: 0;
		padding: 0 0.8rem 0.5rem;
		background: none;
		border: 0;
		font-size: 0.75rem;
		line-height: 1.5;
	}
	pre.namehit { color: var(--pico-muted-color); font-style: italic; }
	pre .ln { color: var(--pico-muted-color); user-select: none; }
	mark { padding: 0 1px; border-radius: 2px; }
</style>
</head>
<body>
<header class="container">
	<hgroup>
		<h1><a href="./">Formalization Corpus</a></h1>
	</hgroup>
	<nav>
		<ul>
			<li><a href="./" aria-current="page">Search</a></li>
				<li><a href="./corpus.html">Every source</a></li>
			<li><a href="./subjects.html">By subject</a></li>
			<li><a href="./api.html">API</a></li>
		</ul>
	</nav>
</header>

<main class="container">
		<form id="f">
			<input type="search" id="q" name="q" placeholder="IsometryEquiv" autocomplete="off" autofocus spellcheck="false">
			<button type="submit">Search</button>
	</form>
	<p class="hint">
		Regular expressions, and zoekt's filters:
		<code>repo:mathlib4</code>, <code>file:\.lean$</code>, <code>case:yes</code>.
		Terms combine with a space; <code>-</code> negates.
	</p>

	<div id="status"></div>
	<div id="results"></div>

	<p class="hint" id="counts"></p>
</main>

<script>
// ?api=http://localhost:6070/api/search points the page at a tunnelled or
// local zoekt, which is how this file is tested before it is published.
const API = new URLSearchParams(location.search).get("api")
		|| "https://formalization-corpus.dzackgarza.com/api/search";
const MAX = 60;

// Shiki tokenises with the same TextMate grammars Lean's own editors use.
// Agda is not in the bundle, so .agda files stay plain rather than being
// coloured by a grammar that does not describe them.
const LANGS = {lean: "lean", v: "coq"};
const THEME = matchMedia("(prefers-color-scheme: dark)").matches
	? "github-dark" : "github-light";
let shiki = null;

const shikiReady = (async () => {
	const {createHighlighter} = await import("https://cdn.jsdelivr.net/npm/shiki@4/+esm");
	shiki = await createHighlighter({themes: [THEME], langs: Object.values(LANGS)});
})().catch(err => console.error("syntax highlighting unavailable:", err));

let corpus = {repos: {}, counts: {}};
const el = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
const rx = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

// Zoekt returns file content as base64 of raw bytes; the corpus is full of
// non-ASCII mathematical notation, so decode as UTF-8 rather than latin-1.
const decoder = new TextDecoder();
const encoder = new TextEncoder();
function b64(s) {
	const bin = atob(s);
	const bytes = new Uint8Array(bin.length);
	for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
	return decoder.decode(bytes);
}

function sourceLink(repoName, path, line) {
	const repo = corpus.repos[repoName];
	if (!repo) return null;
	if (repo.transport === "web-dir") {
		const base = repo.url.replace(/\/$/, "");
		return `${base}/${path.split("/").pop()}`;
	}
	// Shallow checkouts track their default branch; HEAD resolves it.
	const middle = repo.transport === "gitlab" ? "/-/blob/HEAD/" : "/blob/HEAD/";
	return `${repo.url}${middle}${path}` + (line ? `#L${line}` : "");
}

async function query(Q, Opts) {
	const res = await fetch(API, {
		method: "POST",
		headers: {"Content-Type": "application/json"},
		body: JSON.stringify({Q, Opts}),
	});
	if (!res.ok) throw new Error(`${res.status} ${res.statusText}: ${(await res.text()).slice(0, 300)}`);
	return (await res.json()).Result || {};
}

// A search result is an excerpt, and an excerpt cannot be tokenised correctly:
// a match inside a block comment or a string looks like code once its opening
// delimiter is out of frame. The search asks for Whole content, so the file is
// in hand — exactly the bytes that matched, no drift against a branch that has
// moved on — and only the prefix up to the last displayed line is tokenised,
// which is what fixes the grammar state.
//
// Tokenising costs about 7.6 s per megabyte of Lean, so a prefix past this
// size is left uncoloured rather than freezing the page for seconds.
const PREFIX_LIMIT = 150000;

function lineStarts(text) {
	const starts = [0];
	for (const line of text.split("\n")) starts.push(starts.at(-1) + encoder.encode(line).length + 1);
	return starts;
}

// Marks split the styled runs of a line, so a hit starting mid-token stays
// highlighted and keeps its colour.
function renderLine(tokens, lineNo, marks) {
	let html = "", at = 0;
	for (const t of tokens) {
		const end = at + t.content.length;
		let cursor = at;
		while (cursor < end) {
			const inside = marks.find(([a, b]) => cursor >= a && cursor < b);
			const stop = inside
				? Math.min(end, inside[1])
				: Math.min(end, ...marks.filter(([a]) => a > cursor).map(([a]) => a));
			const piece = esc(t.content.slice(cursor - at, stop - at));
			const styled = t.color ? `<span style="color:${t.color}">${piece}</span>` : piece;
			html += inside ? `<mark>${styled}</mark>` : styled;
			cursor = stop;
		}
		at = end;
	}
	return `<span class="ln">${String(lineNo).padStart(5)}</span>  ${html}`;
}

function chunkLines(chunk, text) {
	const first = chunk.ContentStart ? chunk.ContentStart.LineNumber : 1;
	const height = b64(chunk.Content).replace(/\n$/, "").split("\n").length;
	return {first, last: first + height - 1};
}

// One file's excerpts, tokenised together so grammar state is right.
function fileHtml(match, text, tokensByLine) {
	const starts = lineStarts(text);
	const lines = text.split("\n");
	return (match.ChunkMatches || []).filter(c => !c.FileName).slice(0, 3).map(chunk => {
		const {first, last} = chunkLines(chunk, text);
		const out = [];
		for (let n = first; n <= last && n <= lines.length; n++) {
			const lineText = lines[n - 1];
			const raw = encoder.encode(lineText);
			const marks = [];
			for (const r of (chunk.Ranges || [])) {
				const a = r.Start.ByteOffset - starts[n - 1];
				const b = r.End.ByteOffset - starts[n - 1];
				if (a < 0 || b > raw.length || b <= a) continue;
				marks.push([decoder.decode(raw.slice(0, a)).length, decoder.decode(raw.slice(0, b)).length]);
			}
			const tokens = tokensByLine ? tokensByLine[n - 1] : [{content: lineText, color: null}];
			out.push(renderLine(tokens || [{content: lineText, color: null}], n, marks));
		}
		return out.join("\n");
	}).join("\n\n");
}

function langOf(name) {
	return LANGS[(name.split(".").pop() || "").toLowerCase()] || null;
}

// Results appear uncoloured, then each file is coloured in turn. Yielding
// between files keeps the page responsive while the grammar runs.
async function colourise(blocks) {
	await shikiReady;
	if (!shiki) return;
	for (const {block, match, text} of blocks) {
		const lang = langOf(match.FileName);
		if (!lang) continue;
		const starts = lineStarts(text);
		const last = Math.max(...(match.ChunkMatches || []).filter(c => !c.FileName)
			.map(c => chunkLines(c, text).last), 1);
		const prefixBytes = starts[Math.min(last, starts.length - 1)];
		if (prefixBytes > PREFIX_LIMIT) continue;
		const prefix = text.split("\n").slice(0, last).join("\n");
		const tokensByLine = shiki.codeToTokens(prefix, {lang, theme: THEME}).tokens;
		block.querySelector("pre").innerHTML = fileHtml(match, text, tokensByLine);
		await new Promise(r => setTimeout(r, 0));
	}
}

function render(result) {
	const byRepo = new Map();
	for (const f of (result.Files || [])) {
		if (!byRepo.has(f.Repository)) byRepo.set(f.Repository, []);
		byRepo.get(f.Repository).push(f);
	}

		const pending = [];
		el("results").innerHTML = [...byRepo].map(([name, matches]) => {
			const repo = corpus.repos[name];
			const kind = repo ? ({
				lean: "Lean", reservoir: "Reservoir", rocq: "Rocq", agda: "Agda",
				isabelle: "Isabelle", "hol-light": "HOL Light", hol4: "HOL4",
				mizar: "Mizar", metamath: "Metamath", acl2: "ACL2", pvs: "PVS",
				twelf: "Twelf/LF",
			}[repo.kind] || repo.kind) : "";
		const head = repo ? `<a href="${repo.url}">${esc(name)}</a>` : esc(name);
		const body = matches.map((f, i) => {
			const chunks = (f.ChunkMatches || []).filter(c => !c.FileName);
			const line = chunks.length ? chunks[0].ContentStart.LineNumber : 0;
			const href = sourceLink(name, f.FileName, line);
			const path = href ? `<a href="${href}">${esc(f.FileName)}</a>` : esc(f.FileName);
			// A file can match on its name alone, which has no lines to show.
			if (!chunks.length) {
				return `<div class="file"><div class="path">${path}</div>`
					+ `<pre class="namehit">matched in the file name</pre></div>`;
			}
			const text = f.Content ? b64(f.Content) : null;
			const id = `f${byRepo.size}-${esc(name)}-${i}`.replace(/[^\w-]/g, "_");
			pending.push({id, match: f, text});
			return `<div class="file" id="${id}"><div class="path">${path}</div>`
				+ `<pre>${text ? fileHtml(f, text, null) : ""}</pre></div>`;
		}).join("");
		return `<article><header>${head}<span class="tag">${kind}</span></header>${body}</article>`;
	}).join("");

	colourise(pending
		.filter(p => p.text)
		.map(p => ({block: document.getElementById(p.id), match: p.match, text: p.text}))
		.filter(p => p.block)
	).catch(err => console.error("highlighting failed:", err));
}

function fail(err) {
	console.error(err);
	el("status").className = "broken";
	el("status").textContent = `search failed — ${err.message || err}`;
}

async function search(q) {
	el("status").className = "";
	el("status").textContent = "searching…";
	el("results").innerHTML = "";
	const started = performance.now();
	let result;
	try {
		result = await query(q, {MaxDocDisplayCount: MAX, ChunkMatches: true, Whole: true});
	} catch (err) {
		fail(err);
		return;
	}

	// Zoekt embeds its Stats struct directly in Result, so the counters sit at
	// the top level rather than under a Stats key.
	const found = result.Files || [];
	const roundTrip = Math.round(performance.now() - started);
	const searchMs = Math.round((result.Duration || 0) / 1e6);
	if (!found.length) {
		el("status").textContent =
			`no matches · ${result.FilesConsidered || 0} files considered · ${roundTrip} ms`;
		return;
	}
	const shown = found.length;
	const total = result.FileCount || shown;
	el("status").textContent =
		`${shown} file${shown === 1 ? "" : "s"}`
		+ (total > shown ? ` of ${total} matching` : "")
		+ ` · ${result.MatchCount || 0} matches`
		+ ` · ${searchMs} ms search, ${roundTrip} ms round trip`;
	render(result);
}

function fromHash() {
	const q = decodeURIComponent(location.hash.replace(/^#/, ""));
	if (q) { el("q").value = q; search(q); }
}

el("f").addEventListener("submit", e => {
	e.preventDefault();
	const q = el("q").value.trim();
	if (!q) return clear();
	location.hash = encodeURIComponent(q);
	search(q);
});

function clear() {
	el("results").innerHTML = "";
	el("status").className = "";
	el("status").textContent = "";
	if (location.hash) history.replaceState(null, "", location.pathname + location.search);
}

// Emptying the box — including with the search field's own clear button, which
// fires input rather than submit — leaves no results behind.
el("q").addEventListener("input", () => { if (!el("q").value.trim()) clear(); });
window.addEventListener("hashchange", fromHash);

fetch("./corpus.json").then(r => r.json()).then(data => {
	corpus = data;
	el("counts").innerHTML =
			`Mathlib, the Fermat's Last Theorem and Carleson's theorem projects, `
			+ `Viazovska's sphere packing, condensed mathematics, the Lean package `
			+ `registry — plus the major Rocq, Agda, Isabelle, HOL, Mizar, Metamath, `
			+ `ACL2, PVS and LF libraries. <a href="./corpus.html">Every source</a>, or `
			+ `<a href="./subjects.html">by subject</a>.`;
	fromHash();
});
</script>
</body>
</html>
