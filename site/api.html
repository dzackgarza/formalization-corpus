<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API — Formalization Corpus</title>
<meta name="description" content="OpenAPI reference for the Formalization Corpus search API.">
<link rel="stylesheet" href="./api-shell.css">
<link rel="service-desc" type="application/vnd.oai.openapi+json;version=3.1" href="https://formalization-corpus.dzackgarza.com/api/openapi.json">
</head>
<body>
<header class="api-site-header">
  <div class="api-masthead">
    <a class="api-brand" href="./"><span class="api-brand-mark" aria-hidden="true">FC</span><span>Formalization Corpus</span></a>
    <nav class="api-site-nav" aria-label="Primary">
      <a href="./">Search</a>
      <a href="./corpus.html">Sources</a>
      <a href="./topics.html">Topics</a>
      <a href="./contribute.html">Contribute</a>
      <a href="./agents.html">Agents</a>
      <a href="./api.html" aria-current="page">API</a>
    </nav>
  </div>
</header>
<div id="api-docs" aria-label="Formalization Corpus API reference"></div>
<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.68.0/dist/browser/standalone.js"></script>
<script>
const spec = new URLSearchParams(location.search).get("spec")
  || "https://formalization-corpus.dzackgarza.com/api/openapi.json";
Scalar.createApiReference("#api-docs", {
  url: spec,
  theme: "default",
  darkMode: matchMedia("(prefers-color-scheme: dark)").matches,
  mcp: {disabled: true},
  modelsSectionLabel: "Schemas",
  showOperationId: true,
  showDeveloperTools: "never",
  defaultHttpClient: {targetKey: "shell", clientKey: "curl"},
  defaultRequestBodyView: "raw",
  withDefaultFonts: true,
});
</script>
</body>
</html>
